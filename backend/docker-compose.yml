services:

  db:
    image: postgres:17
    container_name: online_exam_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: online_exam_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    container_name: online_exam_web
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    container_name: online_exam_celery_worker
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    container_name: online_exam_celery_beat
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data: